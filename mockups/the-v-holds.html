<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE V HOLDS · VORNAC</title>
</head>
<body>
<style>
  :root {
    --ground: #050505;
    --ink: #e7e5e4;
    --dim: #79716b;
    --faint: #3f3b38;
    --amber: #f59e0b;
    --amber-hi: #fbbf24;
    --steel: #7d8aa0;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
    cursor: crosshair;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── the V ─────────────────────────────────────────────── */
  #vwrap {
    position: absolute; left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 34px rgba(245, 158, 11, .07));
  }
  #vmark { display: block; overflow: visible; }
  #vwrap.hit #vmain { animation: vjolt .38s steps(2, end); }
  @keyframes vjolt {
    0% { transform: translate(1.5px, -1px); }
    50% { transform: translate(-1.5px, 1px); }
    100% { transform: none; }
  }
  .ghost { opacity: 0; }
  #vwrap.glitch .ghost { opacity: .85; }
  #vwrap.glitch #vmain { animation: vjolt .12s steps(2, end) infinite; }

  /* seal pulse */
  #seal {
    fill: none; stroke: var(--amber); stroke-width: 3;
    opacity: 0; pointer-events: none;
  }
  #vwrap.sealing #seal { animation: seal 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes seal {
    0% { opacity: .9; stroke-width: 5; transform: scale(.96); }
    100% { opacity: 0; stroke-width: .5; transform: scale(1.22); }
  }

  /* ── HUD ───────────────────────────────────────────────── */
  .hud { position: absolute; font-size: 11px; letter-spacing: .14em; z-index: 3; }
  .hud .lbl { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .22em; }

  #brand { top: 28px; left: 32px; display: flex; align-items: center; gap: 12px; }
  #brand svg { display: block; }
  #brand .unit { color: var(--dim); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; line-height: 1.7; }
  #brand .unit b { color: var(--ink); font-weight: 400; display: block; }

  #stats { top: 28px; right: 32px; text-align: right; display: grid; gap: 14px; }
  #stats .num {
    font-size: 22px; color: var(--ink);
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  #stats .num.amber { color: var(--amber); }
  #stats .delta { color: var(--faint); font-size: 10px; }

  #log {
    left: 32px; bottom: 28px; width: min(46ch, calc(100vw - 64px));
    display: flex; flex-direction: column-reverse; gap: 3px;
    font-size: 11px; line-height: 1.5; letter-spacing: .02em;
    mask-image: linear-gradient(to top, #000 55%, transparent);
    -webkit-mask-image: linear-gradient(to top, #000 55%, transparent);
    height: 132px; overflow: hidden;
  }
  #log .t { color: var(--faint); margin-right: 1ch; }
  #log .steel { color: var(--steel); }
  #log .dim { color: var(--dim); }
  #log .amber { color: var(--amber); }
  #log .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #hint { right: 32px; bottom: 28px; color: var(--dim); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; text-align: right; line-height: 2; }
  #hint em { font-style: normal; color: var(--amber); }

  /* ── wordmark ──────────────────────────────────────────── */
  #wm {
    position: absolute; left: 50%; bottom: 17.5%;
    transform: translateX(-50%);
    width: min(520px, 62vw); z-index: 2; text-align: center;
  }
  #wm svg { width: 100%; display: block; }
  #wm .reveal { clip-path: inset(0 100% 0 0); }
  #wm.on .reveal { animation: wipe 1.4s cubic-bezier(.65,0,.2,1) .15s forwards; }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
  #claim {
    margin-top: 16px; color: var(--dim); font-size: 10px;
    letter-spacing: .28em; text-transform: uppercase;
    white-space: nowrap; width: max-content;
    margin-left: 50%; transform: translateX(-50%);
    opacity: 0; transition: opacity 1.2s ease 1.2s;
  }
  #wm.on #claim { opacity: 1; }
  #claim b { color: var(--amber); font-weight: 400; }

  .scanline {
    position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: .5;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.16) 2px 3px);
  }

  @media (max-width: 720px) {
    #stats { display: none; }
    #log { width: calc(100vw - 64px); height: 96px; }
    #vwrap { top: 40%; }
    #wm { bottom: 22%; }
    #hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #vwrap.hit #vmain, #vwrap.glitch #vmain { animation: none; }
    #wm .reveal { clip-path: none; }
    #claim { opacity: 1; }
  }
</style>

<div id="stage">
  <canvas id="fx"></canvas>

  <div id="vwrap">
    <svg id="vmark" width="236" height="208" viewBox="0 0 236 208" aria-label="VORNAC V mark under continuous attack">
      <defs>
        <linearGradient id="vcut" x1="339.35" x2="339.35" y1="894.62" y2="1102.62"
          gradientTransform="matrix(.48429 -.87489 1.06616 .90262 -1217.88 -510.577)" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#fff"/><stop offset=".26" stop-color="#fff"/>
          <stop offset=".52" stop-color="#fff"/><stop offset=".7" stop-color="#fff" stop-opacity=".06"/>
          <stop offset=".88" stop-color="#fff" stop-opacity="0"/><stop offset=".88" stop-color="#fff"/>
          <stop offset="1" stop-color="#fff"/>
        </linearGradient>
        <clipPath id="gA"><rect x="-20" y="30" width="280" height="34"/></clipPath>
        <clipPath id="gB"><rect x="-20" y="120" width="280" height="26"/></clipPath>
      </defs>
      <path id="seal" d="M0 0h50l67 126L187 0h49L114 208z" style="transform-origin: 118px 104px"/>
      <g id="vmain">
        <path fill="url(#vcut)" fill-rule="evenodd" d="M0 0h50l67 126L187 0h49L114 208z"/>
      </g>
      <g class="ghost" id="ghostA" clip-path="url(#gA)">
        <path fill="#f59e0b" fill-rule="evenodd" d="M0 0h50l67 126L187 0h49L114 208z"/>
      </g>
      <g class="ghost" id="ghostB" clip-path="url(#gB)">
        <path fill="#7d8aa0" fill-rule="evenodd" d="M0 0h50l67 126L187 0h49L114 208z"/>
      </g>
    </svg>
  </div>

  <div id="wm">
    <svg viewBox="0 0 1448 208" aria-label="VORNAC">
      <defs>
        <linearGradient id="wcut" x1="339.35" x2="339.35" y1="894.62" y2="1102.62"
          gradientTransform="matrix(.48429 -.87489 1.06616 .90262 -1217.88 -510.577)" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#fff"/><stop offset=".26" stop-color="#fff"/>
          <stop offset=".52" stop-color="#fff"/><stop offset=".7" stop-color="#fff" stop-opacity=".04"/>
          <stop offset=".88" stop-color="#fff" stop-opacity="0"/><stop offset=".88" stop-color="#fff"/>
          <stop offset="1" stop-color="#fff"/>
        </linearGradient>
      </defs>
      <path class="reveal" fill="url(#wcut)" fill-rule="evenodd" d="M0 0h50.1l67 126L187.09 0h49L114.06 207.74z"/>
      <path class="reveal" fill="#e7e5e4" fill-rule="evenodd" d="M297.22 43.48h125l-.11 121.34H297.22zm-1-43.45-44.99 43.45.17 121.34 44.82 42.92h125l44.69-42.92.18-121.34L421.22.03zm212.99 0L670.06 0l41 42v58l-29 27-9 7h-8l55.87 73.74H669.2l-95-115.71h90v-48l-109.99-1v164.71h-45zM754.05 0l149.99 122.03L904 0h41.1l-.06 208.03-147.99-122v121.71h-43zm340.8 0 127.34 207.74h-166.16l23-42.74h69l-52-89-77.26 131.74h-50.73zm178.17 0H1448l-40.99 43-135.99.48V162l4 2.82h130.99l41.99 42.92h-175.98l-44.53-42.92-.6-121.34z"/>
    </svg>
    <div id="claim">Continuous security validation — <b>every attack becomes proof</b></div>
  </div>

  <div class="hud" id="brand">
    <svg width="26" height="23" viewBox="0 0 236 208"><path fill="#f59e0b" d="M0 0h50l67 126L187 0h49L114 208z"/></svg>
    <div class="unit"><b>VORNAC</b>brand unit / live</div>
  </div>

  <div class="hud" id="stats">
    <div><div class="lbl">attacks deflected</div><div class="num" id="nDefl">0</div></div>
    <div><div class="lbl">exploits proven &amp; sealed</div><div class="num amber" id="nProv">0</div></div>
    <div><div class="lbl">validation uptime</div><div class="num" id="nUp">00:00</div><div class="delta">never stops</div></div>
  </div>

  <div class="hud" id="log" aria-hidden="true"></div>

  <div class="hud" id="hint">
    <em>click / hold</em> — launch your own attack<br>
    the v holds
  </div>

  <div class="scanline"></div>
</div>

<script>
(function () {
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var vwrap = document.getElementById('vwrap');
  var wm = document.getElementById('wm');
  var nDefl = document.getElementById('nDefl'), nProv = document.getElementById('nProv'), nUp = document.getElementById('nUp');
  var logEl = document.getElementById('log');

  var W = 0, H = 0, DPR = 1, t0 = performance.now();
  var VW = 236, VH = 208, vScale = 1, vX = 0, vY = 0;

  // exact V polygon from the brand path: M0 0 h50 L117 126 L187 0 h49 L114 208 z
  var poly = [[0,0],[50,0],[117,126],[187,0],[236,0],[114,208]];
  var edges = [], perim = 0;
  for (var i = 0; i < poly.length; i++) {
    var a = poly[i], b = poly[(i + 1) % poly.length];
    var len = Math.hypot(b[0]-a[0], b[1]-a[1]);
    edges.push({ a: a, b: b, len: len }); perim += len;
  }
  function edgePoint() { // random point on the V outline (screen coords)
    var d = Math.random() * perim;
    for (var i = 0; i < edges.length; i++) {
      if (d <= edges[i].len) {
        var e = edges[i], f = d / e.len;
        return {
          x: vX + (e.a[0] + (e.b[0]-e.a[0]) * f) * vScale,
          y: vY + (e.a[1] + (e.b[1]-e.a[1]) * f) * vScale
        };
      }
      d -= edges[i].len;
    }
    return { x: vX + 118 * vScale, y: vY + 104 * vScale };
  }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var vh = Math.min(H * 0.42, 380), s = vh / VH;
    vScale = s;
    var svg = document.getElementById('vmark');
    svg.setAttribute('width', VW * s); svg.setAttribute('height', VH * s);
    var r = svg.getBoundingClientRect();
    vX = r.left; vY = r.top;
  }
  addEventListener('resize', resize); resize();
  setTimeout(resize, 60); // after layout settles

  // ── log ──────────────────────────────────────────────────
  var probes = ['sqli param=id', 'xss reflected /search', 'ssh brute t=4', 'jwt alg:none', 'ssrf 169.254.169.254', 'path traversal ../../etc', 'smb relay', 'oauth redirect_uri', 'cve-2025-1094 psql', 'deserialization jvm', 'idor /api/v2/users', 'subdomain takeover', 'race condition /checkout', 'xxe soap envelope', 'nosql $ne injection', 'cache poisoning', 'prototype pollution', 'graphql introspection'];
  var verdicts = ['deflected', 'no path', 'dead end', 'blocked @edge', 'contained'];
  function ts() {
    var d = new Date();
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function logLine(html) {
    var div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = '<span class="t">[' + ts() + ']</span>' + html;
    logEl.prepend(div);
    while (logEl.children.length > 14) logEl.removeChild(logEl.lastChild);
  }

  // ── particles ────────────────────────────────────────────
  var tracers = [], sparks = [];
  var deflected = 0, proven = 0;

  function spawnTracer(fromX, fromY, manual) {
    var to = edgePoint();
    var mx = (fromX + to.x) / 2, my = (fromY + to.y) / 2;
    var dx = to.x - fromX, dy = to.y - fromY, dl = Math.hypot(dx, dy) || 1;
    var bow = (Math.random() - .5) * dl * .5;
    tracers.push({
      x0: fromX, y0: fromY, cx: mx - dy / dl * bow, cy: my + dx / dl * bow,
      x1: to.x, y1: to.y, p: 0,
      v: (manual ? .022 : .009) + Math.random() * .008,
      manual: !!manual, trail: []
    });
  }
  function edgeSpawn() {
    var s = Math.random() * 2 * (W + H), x, y;
    if (s < W) { x = s; y = -20; }
    else if (s < W + H) { x = W + 20; y = s - W; }
    else if (s < 2 * W + H) { x = s - W - H; y = H + 20; }
    else { x = -20; y = s - 2 * W - H; }
    spawnTracer(x, y, false);
  }
  function qbez(a, c, b, t) { var u = 1 - t; return u*u*a + 2*u*t*c + t*t*b; }

  function burst(x, y, big) {
    var n = big ? 26 : 10 + (Math.random() * 6 | 0);
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2, sp = (big ? 2.6 : 1.6) * (0.4 + Math.random());
      sparks.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 1, decay: .015 + Math.random() * .025, amber: big || Math.random() < .8 });
    }
  }

  function impact(tr) {
    burst(tr.x1, tr.y1, false);
    deflected++;
    nDefl.textContent = deflected;
    vwrap.classList.remove('hit'); void vwrap.offsetWidth; vwrap.classList.add('hit');
    var probe = probes[Math.random() * probes.length | 0];
    var verdict = verdicts[Math.random() * verdicts.length | 0];
    logLine('<span class="steel">' + (tr.manual ? 'your ' : '') + 'probe</span> <span class="dim">' + probe + '</span> → ' + verdict);
  }

  // ── glitch: an exploit gets through, is proven, sealed ───
  var ghostA = document.getElementById('ghostA'), ghostB = document.getElementById('ghostB');
  function glitch() {
    if (reduced) return;
    var probe = probes[Math.random() * probes.length | 0];
    logLine('<span class="amber">exploit chain</span> <span class="dim">' + probe + '</span> → <span class="amber">PROVEN</span>');
    vwrap.classList.add('glitch');
    var jitters = 0;
    var ji = setInterval(function () {
      ghostA.setAttribute('transform', 'translate(' + ((Math.random()*10-5)|0) + ' 0)');
      ghostB.setAttribute('transform', 'translate(' + ((Math.random()*10-5)|0) + ' 0)');
      if (++jitters > 7) {
        clearInterval(ji);
        vwrap.classList.remove('glitch');
        ghostA.removeAttribute('transform'); ghostB.removeAttribute('transform');
        vwrap.classList.remove('sealing'); void vwrap.offsetWidth; vwrap.classList.add('sealing');
        burst(vX + 118 * vScale, vY + 104 * vScale, true);
        proven++;
        nProv.textContent = proven;
        var ms = (1200 + Math.random() * 2400 | 0) / 1000;
        setTimeout(function () { logLine('<span class="dim">└ sealed, retest passed in ' + ms.toFixed(1) + 's</span>'); }, 700);
      }
    }, 70);
  }

  // ── interaction ──────────────────────────────────────────
  var holdTimer = null, px = 0, py = 0;
  function volley(x, y, n) { for (var i = 0; i < n; i++) setTimeout(function () { spawnTracer(x + (Math.random()*80-40), y + (Math.random()*80-40), true); }, i * 55); }
  addEventListener('pointermove', function (e) { px = e.clientX; py = e.clientY; });
  addEventListener('pointerdown', function (e) {
    px = e.clientX; py = e.clientY;
    volley(px, py, 5);
    holdTimer = setInterval(function () { spawnTracer(px + (Math.random()*120-60), py + (Math.random()*120-60), true); }, 110);
  });
  addEventListener('pointerup', function () { clearInterval(holdTimer); });
  addEventListener('pointercancel', function () { clearInterval(holdTimer); });

  // ── main loop ────────────────────────────────────────────
  var lastSpawn = 0, lastGlitch = performance.now() + 6000;
  function frame(now) {
    ctx.clearRect(0, 0, W, H);

    if (!reduced && now - lastSpawn > 260 + Math.random() * 500) { edgeSpawn(); lastSpawn = now; }
    if (!reduced && now > lastGlitch) { glitch(); lastGlitch = now + 8000 + Math.random() * 7000; }

    // tracers
    for (var i = tracers.length - 1; i >= 0; i--) {
      var tr = tracers[i];
      tr.p += tr.v;
      var px = qbez(tr.x0, tr.cx, tr.x1, Math.min(tr.p, 1));
      var py = qbez(tr.y0, tr.cy, tr.y1, Math.min(tr.p, 1));
      tr.trail.push([px, py]);
      if (tr.trail.length > 14) tr.trail.shift();
      for (var j = 1; j < tr.trail.length; j++) {
        var al = j / tr.trail.length;
        ctx.strokeStyle = tr.manual
          ? 'rgba(245,158,11,' + (al * .85) + ')'
          : 'rgba(148,163,184,' + (al * .75) + ')';
        ctx.lineWidth = al * 2.2;
        ctx.beginPath();
        ctx.moveTo(tr.trail[j-1][0], tr.trail[j-1][1]);
        ctx.lineTo(tr.trail[j][0], tr.trail[j][1]);
        ctx.stroke();
      }
      if (tr.p >= 1) { impact(tr); tracers.splice(i, 1); }
    }

    // sparks
    for (var k = sparks.length - 1; k >= 0; k--) {
      var s = sparks[k];
      s.x += s.vx; s.y += s.vy; s.vx *= .96; s.vy *= .96; s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(k, 1); continue; }
      ctx.fillStyle = s.amber
        ? 'rgba(251,191,36,' + s.life * .9 + ')'
        : 'rgba(231,229,228,' + s.life * .6 + ')';
      ctx.fillRect(s.x - 1, s.y - 1, 2, 2);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // uptime
  setInterval(function () {
    var s = (performance.now() - t0) / 1000 | 0;
    function p(n){ return (n < 10 ? '0' : '') + n; }
    nUp.textContent = p(s / 60 | 0) + ':' + p(s % 60);
  }, 1000);

  // opening sequence
  logLine('<span class="dim">vornac validation engine — attached to target</span>');
  setTimeout(function () { logLine('<span class="dim">attack surface mapped · 6 edges · 0 blind spots</span>'); }, 900);
  setTimeout(function () { wm.classList.add('on'); }, 2200);
  if (reduced) {
    wm.classList.add('on');
    logLine('<span class="dim">reduced motion — swarm paused, coverage unchanged</span>');
  }
})();
</script>
</body>
</html>
