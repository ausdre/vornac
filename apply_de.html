<!-- Main Content -->
<main class="relative z-10">
    <section class="py-16 lg:py-24">
        <div class="max-w-4xl mx-auto px-6">
            
            <!-- Back Link -->
            <div class="mb-8">
                <a href="/about_de#karriere" class="inline-flex items-center gap-2 text-stone-600 hover:text-stone-900 font-bold uppercase text-sm tracking-wide transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Zurück zu Karriere
                </a>
            </div>

            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="font-heading text-5xl md:text-7xl font-black italic uppercase text-stone-900 mb-4 tracking-tight leading-none">
                    Bewerbung
                </h1>
                <p class="text-xl text-stone-600 max-w-2xl mx-auto">
                    Werde Teil des VORNAC Teams. Wir freuen uns auf deine Bewerbung!
                </p>
            </div>

            <!-- Application Form -->
            <div class="bg-white border-4 border-stone-900 p-10 md:p-14 shadow-[16px_16px_0px_0px_rgba(0,0,0,1)] mb-12">

                <form name="application-de" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" class="space-y-8">

                    <!-- Honeypot -->
                    <input type="hidden" name="form-name" value="application-de" />
                    <p class="hidden">
                        <label>Nicht ausfüllen: <input name="bot-field" /></label>
                    </p>

                    <!-- Position -->
                    <div>
                        <label class="block font-black text-stone-900 mb-3 uppercase text-base tracking-wider">
                            Position *
                        </label>
                        <select name="position" required id="position-select"
                                class="w-full px-5 py-4 border-4 border-stone-900 bg-white text-stone-900 font-mono text-base focus:outline-none focus:border-amber-500 focus:shadow-[4px_4px_0px_0px_rgba(245,158,11,1)] transition-all">
                            <option value="">Bitte wählen</option>
                            <option value="Head of Sales">Head of Sales</option>
                            <option value="Pentester als CSM">Pentester als Customer Success Manager</option>
                            <option value="Assistenz">Assistenz</option>
                            <option value="Initiativbewerbung">Initiativbewerbung</option>
                        </select>
                    </div>

                    <!-- Name -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block font-black text-stone-900 mb-3 uppercase text-base tracking-wider">
                                Vorname *
                            </label>
                            <input type="text" name="firstname" required
                                   class="w-full px-5 py-4 border-4 border-stone-900 bg-white text-stone-900 text-base focus:outline-none focus:border-amber-500 focus:shadow-[4px_4px_0px_0px_rgba(245,158,11,1)] transition-all" />
                        </div>
                        <div>
                            <label class="block font-black text-stone-900 mb-3 uppercase text-base tracking-wider">
                                Nachname *
                            </label>
                            <input type="text" name="lastname" required
                                   class="w-full px-5 py-4 border-4 border-stone-900 bg-white text-stone-900 text-base focus:outline-none focus:border-amber-500 focus:shadow-[4px_4px_0px_0px_rgba(245,158,11,1)] transition-all" />
                        </div>
                    </div>

                    <!-- Email & Phone -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block font-black text-stone-900 mb-3 uppercase text-base tracking-wider">
                                E-Mail *
                            </label>
                            <input type="email" name="email" required
                                   class="w-full px-5 py-4 border-4 border-stone-900 bg-white text-stone-900 text-base focus:outline-none focus:border-amber-500 focus:shadow-[4px_4px_0px_0px_rgba(245,158,11,1)] transition-all" />
                        </div>
                        <div>
                            <label class="block font-black text-stone-900 mb-3 uppercase text-base tracking-wider">
                                Telefon
                            </label>
                            <input type="tel" name="phone"
                                   class="w-full px-5 py-4 border-4 border-stone-900 bg-white text-stone-900 text-base focus:outline-none focus:border-amber-500 focus:shadow-[4px_4px_0px_0px_rgba(245,158,11,1)] transition-all" />
                        </div>
                    </div>

                    <!-- LinkedIn -->
                    <div>
                        <label class="block font-black text-stone-900 mb-3 uppercase text-base tracking-wider">
                            LinkedIn / Portfolio URL
                        </label>
                        <input type="url" name="linkedin" placeholder="https://"
                               class="w-full px-5 py-4 border-4 border-stone-900 bg-white text-stone-900 text-base focus:outline-none focus:border-amber-500 focus:shadow-[4px_4px_0px_0px_rgba(245,158,11,1)] transition-all" />
                    </div>

                    <!-- CV Upload -->
                    <div>
                        <label class="block font-black text-stone-900 mb-3 uppercase text-base tracking-wider">
                            Lebenslauf (PDF) *
                        </label>
                        <div class="relative">
                            <input type="file" name="cv" id="cv-upload" accept=".pdf" required class="hidden" />
                            <label for="cv-upload" class="flex items-center justify-between w-full px-5 py-4 border-4 border-stone-900 bg-white text-stone-700 cursor-pointer hover:border-amber-500 transition-all">
                                <span id="cv-filename" class="text-base">Keine Datei ausgewählt</span>
                                <span class="bg-stone-900 text-white px-6 py-2 font-bold uppercase text-sm hover:bg-amber-600 transition-colors">Datei wählen</span>
                            </label>
                        </div>
                        <p class="text-sm text-stone-500 mt-2 font-mono">Maximal 10 MB</p>
                    </div>

                    <!-- Message -->
                    <div>
                        <label class="block font-black text-stone-900 mb-3 uppercase text-base tracking-wider">
                            Anschreiben / Motivation *
                        </label>
                        <textarea name="message" rows="10" required
                                  placeholder="Erzähle uns, warum du zu VORNAC passt..."
                                  class="w-full px-5 py-4 border-4 border-stone-900 bg-white text-stone-900 text-base focus:outline-none focus:border-amber-500 focus:shadow-[4px_4px_0px_0px_rgba(245,158,11,1)] transition-all resize-none"></textarea>
                    </div>

                    <!-- Privacy -->
                    <div class="flex items-start gap-4 bg-amber-50 p-5 border-2 border-amber-200">
                        <input type="checkbox" name="privacy" required id="privacy"
                               class="mt-1 w-6 h-6 border-2 border-stone-900 accent-amber-500 cursor-pointer" />
                        <label for="privacy" class="text-sm text-stone-700 leading-relaxed">
                            Ich habe die <a href="/legal_de" class="text-amber-600 hover:text-amber-700 font-bold underline">Datenschutzerklärung</a> zur Kenntnis genommen und bin mit der Verarbeitung meiner Daten einverstanden. *
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit"
                            class="w-full bg-stone-900 text-white py-6 font-black uppercase tracking-[0.2em] text-lg border-4 border-stone-900 shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] hover:bg-amber-600 hover:border-amber-600 hover:translate-x-2 hover:translate-y-2 hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all">
                        Bewerbung absenden →
                    </button>

                </form>

            </div>

        </div>
    </section>
</main>

                <a href="/legal_de#impressum" class="hover:text-white transition-colors">Impressum</a>
                <a href="https://www.linkedin.com/company/vornac" target="_blank" class="hover:text-amber-500 transition-colors">LinkedIn</a>
            </div>

            <div class="flex items-center gap-4 text-[10px] font-bold uppercase tracking-[0.2em] text-stone-500">
                <span class="text-amber-500">DE</span>
                <span class="text-stone-700">|</span>
                <a href="/apply" class="hover:text-amber-500 transition-colors">EN</a>
            </div>

        </div>
        <div class="mt-8 pt-8 border-t border-stone-800 text-center">
            <p class="text-xs text-stone-500">
                &copy; 2026 VORNAC GmbH. Alle Rechte vorbehalten.
            </p>
        </div>
    </div>
</footer>

<script>
// Mobile menu toggle
const navToggle = document.getElementById('nav-toggle');
const mobileMenu = document.getElementById('mobile-menu');
const mobileBackdrop = document.getElementById('mobile-backdrop');

if (navToggle) {
    navToggle.addEventListener('click', () => {
        mobileMenu?.classList.toggle('hidden');
        mobileBackdrop?.classList.toggle('hidden');
    });
}

if (mobileBackdrop) {
    mobileBackdrop.addEventListener('click', () => {
        mobileMenu?.classList.add('hidden');
        mobileBackdrop?.classList.add('hidden');
    });
}

// Auto-select position from URL
const urlParams = new URLSearchParams(window.location.search);
const position = urlParams.get('position');
if (position) {
    const select = document.getElementById('position-select');
    const options = {
        'head-of-sales': 'Head of Sales',
        'pentester-csm': 'Pentester als CSM',
        'assistenz': 'Assistenz',
        'initiativbewerbung': 'Initiativbewerbung'
    };
    if (select && options[position]) {
        select.value = options[position];
    }
}

// File upload filename display
const fileInput = document.getElementById('cv-upload');
const filenameDisplay = document.getElementById('cv-filename');
if (fileInput && filenameDisplay) {
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            filenameDisplay.textContent = file.name;
            filenameDisplay.classList.add('font-mono', 'text-stone-900');
        } else {
            filenameDisplay.textContent = 'Keine Datei ausgewählt';
            filenameDisplay.classList.remove('font-mono', 'text-stone-900');
        }
    });
}
</script>
